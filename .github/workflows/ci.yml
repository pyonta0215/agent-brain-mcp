name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (MCP, tools, guard, migration, template, client)
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  lint-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - name: Lint CloudFormation template
        run: cfn-lint --ignore-checks W3002 -- infra/template.yaml
